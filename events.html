<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling Practice</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .box { width: 150px; height: 150px; background: #3498db; margin: 15px 0;
               display: flex; align-items: center; justify-content: center;
               color: white; font-size: 14px; cursor: pointer; border-radius: 8px;
               transition: all 0.3s ease; }
        .box:hover { transform: scale(1.05); }
        #output { padding: 10px; background: #f1f1f1; margin-top: 15px;
                  border-radius: 5px; min-height: 40px; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer;
                 border: none; border-radius: 4px; background: #2ecc71; color: white; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>DOM Event Handling</h2>

    <div class="box" id="colorBox">Click me!</div>

    <div>
        <input type="text" id="nameInput" placeholder="Type your name...">
        <button id="greetBtn">Greet</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div id="output">Events will show here...</div>

    <script>
        const box = document.getElementById('colorBox');
        const input = document.getElementById('nameInput');
        const greetBtn = document.getElementById('greetBtn');
        const resetBtn = document.getElementById('resetBtn');
        const output = document.getElementById('output');

        // random color on click
        const colors = ['#e74c3c', '#2ecc71', '#3498db', '#f39c12', '#9b59b6', '#1abc9c'];

        box.addEventListener('click', function() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            this.style.backgroundColor = randomColor;
            output.textContent = 'Color changed to: ' + randomColor;
        });

        // double click to reset
        box.addEventListener('dblclick', function() {
            this.style.backgroundColor = '#3498db';
            output.textContent = 'Color reset!';
        });

        // greet button
        greetBtn.addEventListener('click', function() {
            const name = input.value.trim();
            if (name) {
                output.innerHTML = '<strong>Hello, ' + name + '!</strong> Welcome to DOM practice.';
            } else {
                output.textContent = 'Please enter your name first.';
            }
        });

        // keypress event on input
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') greetBtn.click();
        });

        // reset
        resetBtn.addEventListener('click', function() {
            input.value = '';
            output.textContent = 'Events will show here...';
            box.style.backgroundColor = '#3498db';
        });

        // mouse enter/leave
        box.addEventListener('mouseenter', function() {
            this.textContent = 'Hovering!';
        });
        box.addEventListener('mouseleave', function() {
            this.textContent = 'Click me!';
        });
    </script>
</body>
</html>
